name: Build & Publish helium-browser-bin
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 6am UTC

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git openssh rsync curl

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Install cloudflared client
        run: |
          curl -L -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

      - name: Set up SSH over Cloudflare Access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REPO_SERVER_SSH_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host panstore
            HostName ssh.pancakse.dev
            User ${{ secrets.REPO_SERVER_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Import Helium's GPG signing key
        run: |
          su builder -c "
            curl -sL https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc -o /tmp/helium_pub.asc &&
            gpg --import /tmp/helium_pub.asc
          "

      - name: Clone your fork
        run: |
          su builder -c "
            cd /home/builder &&
            git clone https://github.com/ItzPancakse/helium-browser-bin.git
          "

      - name: Build package
        run: |
          su builder -c "
            cd /home/builder/helium-browser-bin &&
            makepkg -s --noconfirm
          "

      - name: Pull existing repo db from pancake-linux repo
        run: |
          rsync -avz --ignore-missing-args -e "ssh -F /root/.ssh/config" \
            panstore:/srv/myrepo/x86_64/pancakelinuxrepo.db.tar.gz \
            panstore:/srv/myrepo/x86_64/pancakelinuxrepo.files.tar.gz \
            /home/builder/helium-browser-bin/ || true
          chown builder:builder /home/builder/helium-browser-bin/*.tar.gz 2>/dev/null || true

      - name: Add to repo database
        run: |
          su builder -c "
            cd /home/builder/helium-browser-bin &&
            repo-add pancakelinuxrepo.db.tar.gz *.pkg.tar.zst
          "

      - name: Deploy to pancake-linux repo
        run: |
          rsync -avz --no-perms -e "ssh -F /root/.ssh/config" \
            /home/builder/helium-browser-bin/*.pkg.tar.zst \
            /home/builder/helium-browser-bin/pancakelinuxrepo.db.tar.gz \
            /home/builder/helium-browser-bin/pancakelinuxrepo.db \
            /home/builder/helium-browser-bin/pancakelinuxrepo.files.tar.gz \
            /home/builder/helium-browser-bin/pancakelinuxrepo.files \
            panstore:/srv/myrepo/x86_64/
            
